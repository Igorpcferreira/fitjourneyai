server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: fitjourneyai

  config:
    import: optional:file:.env[.properties]

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/fitjourneyai}
    username: ${DATABASE_USER:fitjourneyai}
    password: ${DATABASE_PASS:fitjourneyai}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      timeout: 3000

telegram:
  bot-token: ${TELEGRAM_BOT_TOKEN:change-me}
  base-url: https://api.telegram.org
  webhook-path: /telegram/webhook

openai:
  api-key: ${OPENAI_API_KEY:change-me}
  base-url: https://api.openai.com/v1
  model: gpt-5.4-mini        # Opções: gpt-4.1-mini (estável) | gpt-5.4-mini (mais novo, testar)
  timeout-seconds: 90         # Treinos longos precisam esperar a resposta completa

# Configurações de reengajamento por inatividade
fitjourneyai:
  nudge:
    inactivity-days: 3        # Dias sem interação para considerar inativo
    cooldown-hours: 48         # Horas mínimas entre nudges pro mesmo usuário
    interval-ms: 21600000      # Intervalo de verificação: 6h (em ms)

logging:
  level:
    br.edu.puc.fitjourneyai: INFO
    # Para debug de chamadas HTTP:
    # org.springframework.web.client.RestTemplate: DEBUG
